openapi: 3.2.0
info:
  title: OAI Service Add Item API
  version: 0.0.1
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: Add Item
paths:
  /add-item:
    post:
      summary: Add item
      operationId: addItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      responses:
        '200':
          description: Success
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Add Item
components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        set_specs:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - identifier
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
      required:
      - code
      - message
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
