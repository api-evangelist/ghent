openapi: 3.2.0
info:
  title: OAI Service Add Record API
  version: 0.0.1
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: Add Record
paths:
  /add-record:
    post:
      summary: Add record
      operationId: addRecord
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRecordRequest'
        required: true
      responses:
        '200':
          description: Success
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Add Record
components:
  schemas:
    AddRecordRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        metadata_prefix:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
      required:
      - identifier
      - metadata_prefix
      - content
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
      required:
      - code
      - message
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
