openapi: 3.2.0
info:
  title: People Service Get Organizations API
  version: 0.0.1
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: Get Organizations
paths:
  /get-organizations:
    post:
      summary: Get all organization records
      operationId: GetOrganizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrganizationsRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPagedListResponse'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Get Organizations
components:
  schemas:
    OrganizationParent:
      type: object
      properties:
        id:
          type: string
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
      required:
      - id
      - from
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
      required:
      - code
      - message
    OrganizationPagedListResponse:
      type: object
      required:
      - data
      properties:
        cursor:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    GetOrganizationsRequest:
      type: object
      properties:
        cursor:
          type: string
    Organization:
      type: object
      properties:
        id:
          type: string
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        type:
          type: string
        acronym:
          type: string
        name_dut:
          type: string
        name_eng:
          type: string
        parent:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationParent'
        identifier:
          type: array
          items:
            type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
