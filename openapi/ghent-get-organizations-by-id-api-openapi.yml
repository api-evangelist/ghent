openapi: 3.2.0
info:
  title: People Service Get Organizations By Id API
  version: 0.0.1
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: Get Organizations By Id
paths:
  /get-organizations-by-id:
    post:
      summary: Get organization records by their ids
      operationId: GetOrganizationsById
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrganizationsByIdRequest'
        required: true
      responses:
        '200':
          description: Retrieve a organization records successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Get Organizations By Id
components:
  schemas:
    GetOrganizationsByIdRequest:
      type: object
      properties:
        id:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - id
    Organization:
      type: object
      properties:
        id:
          type: string
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        type:
          type: string
        acronym:
          type: string
        name_dut:
          type: string
        name_eng:
          type: string
        parent:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationParent'
        identifier:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
      required:
      - code
      - message
    OrganizationParent:
      type: object
      properties:
        id:
          type: string
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
      required:
      - id
      - from
    OrganizationListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
