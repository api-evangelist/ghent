openapi: 3.2.0
info:
  title: Projects Service Add Project API
  version: 0.0.1
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: Add Project
paths:
  /add-project:
    post:
      summary: Add a single project
      operationId: addProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectRequest'
        required: true
      responses:
        '200':
          description: Success
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Add Project
components:
  schemas:
    AddProject:
      allOf:
      - $ref: '#/components/schemas/Project'
      - required:
        - type
        - identifier
    Project:
      type: object
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        type:
          type: string
        identifier:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              propertyID:
                type: string
              value:
                type: string
            required:
            - type
            - propertyID
            - value
        isFundedBy:
          type: object
          properties:
            type:
              type: string
            hasCallNumber:
              type: string
            isAwardedBy:
              type: object
              nullable: true
              properties:
                type:
                  type: string
                name:
                  type: string
              required:
              - type
              - name
          required:
          - type
        hasAcronym:
          type: array
          items:
            type: string
        name:
          type: array
          items:
            type: object
            properties:
              language:
                type: string
              value:
                type: string
            required:
            - language
            - value
        description:
          type: array
          items:
            type: object
            properties:
              language:
                type: string
              value:
                type: string
            required:
            - language
            - value
        foundingDate:
          type: string
        dissolutionDate:
          type: string
    AddProjectRequest:
      $ref: '#/components/schemas/AddProject'
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
      required:
      - code
      - message
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
