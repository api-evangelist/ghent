openapi: 3.2.0
info:
  title: OAI Service Add Metadata Format API
  version: 0.0.1
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: Add Metadata Format
paths:
  /add-metadata-format:
    post:
      summary: Add a metadata format
      operationId: addMetadataFormat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMetadataFormatRequest'
        required: true
      responses:
        '200':
          description: Success
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Add Metadata Format
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int64
        message:
          type: string
      required:
      - code
      - message
    AddMetadataFormatRequest:
      type: object
      properties:
        metadata_prefix:
          type: string
          minLength: 1
        schema:
          type: string
          minLength: 1
        metadata_namespace:
          type: string
          minLength: 1
      required:
      - metadata_prefix
      - schema
      - metadata_namespace
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
