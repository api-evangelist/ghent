apis:
  - aid: ghent:biblio
    name: Ghent University Academic Bibliography API
    x-operator: institution
    description: >-
      The Academic Bibliography (Biblio) is Ghent University's institutional publication
      and dataset registry, operated by Ghent University Library on the university's own
      host. It exposes a JSON/JSONP REST search API driven by CQL, per-record and
      result-set exports in fourteen bibliographic formats, exports scoped to a person,
      a group, an organizational unit, an organizational unit for one year, or a research
      project, a unAPI 1 discovery service, RSS feeds for any CQL search, a sitemap index
      of every record, and daily full-dataset dumps in CSV, newline-delimited JSON and
      MODS 3.6. Metadata is published under the Open Database License. No key, no
      registration, no rate limit is documented.
    humanURL: https://biblio.ugent.be/doc/api
    baseURL: https://biblio.ugent.be
    tags: [ Research, Publications, Bibliography, Open Data, Library, Research Data, CQL ]
    properties:
      - type: Documentation
        url: https://biblio.ugent.be/doc/api
      - type: OpenAPI
        url: openapi/ghent-biblio-openapi.yml
      - type: JSONSchema
        url: json-schema/ghent-biblio-publication-schema.json
      - type: Vocabulary
        url: vocabulary/ghent-biblio-cql-vocabulary.yml
      - type: Examples
        url: examples/ghent-examples.yml
      - type: License
        url: http://opendatacommons.org/licenses/odbl/
  - aid: ghent:biblio-oai
    name: Ghent University Academic Bibliography OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 harvesting endpoint for the Academic Bibliography. The live Identify
      response names the repository "Ghent University Institutional Archive", declares
      repositoryIdentifier archive.ugent.be, a persistent deletedRecord policy,
      YYYY-MM-DDThh:mm:ssZ granularity and an adminEmail of libservice@ugent.be. This is
      one of the surfaces universities most often outsource and Ghent runs it itself -
      Ghent University Library even publishes the OAI server as open source.
    humanURL: https://biblio.ugent.be/doc/api
    baseURL: https://biblio.ugent.be/oai
    tags: [ OAI-PMH, Research, Publications, Metadata, Harvesting, Library ]
    properties:
