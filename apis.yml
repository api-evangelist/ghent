  - aid: ghent:dodona
    name: Dodona
    x-operator: tenant
    description: >-
      Dodona is the automated programming-practice platform that originated at Ghent
      University and is still used in its computer-science teaching; Ghent registered it
      as a service provider in the Belnet R&E Federation under
      https://dodona.ugent.be/users/saml/metadata. It is recorded as a tenant
