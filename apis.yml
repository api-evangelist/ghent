  detail: >-
    Ghent operates a real, documented, unauthenticated institutional surface and this
    profile reaches it. Every endpoint claimed here was probed on 2026-09-01: the
    bibliography search API, exports, OAI-PMH, SRU, unAPI, sitemap and feeds all
    returned 200; the Hydra Resto API returned 200 on all nine documented paths; the
    university's SAML IdP metadata returned 200. Three first-party OpenAPI 3.1
    contracts were found in the Ghent University Library GitHub organization and are
    saved here. Two claims in the previous profile did not survive probing and have
    been corrected rather than dropped: the library catalogue's OAI-PMH, SRU, IIIF and
    OpenSearch interfaces at lib.ugent.be now 404, because lib.ugent.be redirects to an
    Ex Libris Primo VE deployment (institution code 32RUG_INST) which is recorded as a
    tenant relationship; and the Hydra day-menu path takes unpadded date components,
    where the padded form 404s. No surface was blocked, gated or unreadable. The single
    unreachable host was apivsc.ugent.be, a VSC research-computing service provider
    registered in the Belnet federation whose DNS does not resolve publicly.
