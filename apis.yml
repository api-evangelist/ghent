  - aid: ghent:saml-idp
    name: Ghent University SAML 2.0 Identity Provider
    x-operator: federation
    description: >-
      Ghent University's own SAML 2.0 identity provider, operated by the university's ICT
      directorate. The signed metadata document is publicly readable and carries entityID
      https://identity.ugent.be/simplesaml/saml2/idp/metadata.php on a certificate issued
      to O=Universiteit Gent, OU=Directie ICT, CN=identity.ugent.be, with the Shibboleth
      metadata extension namespace declared. Ghent is a member of the Belnet R&E
      Federation, the Belgian national identity federation, where eight ugent.be entities
      appear - this IdP plus seven service providers including apivsc.ugent.be (Flemish
      Supercomputer Centre), sso.irc.ugent.be, naos.ugent.be and login.psb.ugent.be. A
      federation is shared by definition; the IdP behind it is the institution's.
    humanURL: https://federation.belnet.be/
    baseURL: https://identity.ugent.be/simplesaml/saml2/idp/metadata.php
    tags: [ Identity Federation, SAML, Shibboleth, Single Sign On, Belnet ]
    properties:
