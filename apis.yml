      - type: OpenAPI
        url: openapi/ghent-biblio-openapi.yml
      - type: Vocabulary
        url: vocabulary/ghent-biblio-cql-vocabulary.yml
  - aid: ghent:hydra-resto
    name: Hydra Resto API
    x-operator: institution
    description: >-
      Open JSON API for Ghent University's student restaurants - locations and opening
      hours, day menus, weekly ecological sandwiches, salad bowls, extra food and
      allergen information - served from hydra.ugent.be, a university host. It is built
      and maintained by Zeus WPI, the university's computer-science student working
      group, and powers the Hydra student app; the menu data itself is scraped from
      ugent.be and remains the university's. Version 1.0 is retired, 2.x is current, and
      the operator documents a real forward-compatibility contract - clients must
      tolerate new values of kind and type. Day-menu dates use unpadded components
      (/menu/en/2026/9/1.json); the zero-padded form returns 404.
    humanURL: https://github.com/ZeusWPI/hydra/blob/master/api-resto-02.md
    baseURL: https://hydra.ugent.be/api/2.0/resto
