  - aid: ghent:people-service
    name: Ghent University Library People Service
    x-operator: institution
    description: >-
      An OpenAPI 3.1 contract authored and open-sourced by Ghent University Library for
      the people and organizations directory behind the Academic Bibliography. Sixteen
      operations covering person and organization records, identifier lookup, suggest,
