  - aid: ghent:biblio-sru
    name: Ghent University Academic Bibliography SRU
    x-operator: institution
    description: >-
      SRU 1.1 search/retrieve service over the Academic Bibliography, driven by
      Contextual Query Language. Seventy-eight indexes are documented with their
      supported relations and sortability, from abstract and affiliation through JCR
      impact-factor deciles to VABB approval status. The operator states the caveats
      plainly - scan and explain are unsupported, result sets are unsupported, only the
      default CQL context set is available.
    humanURL: https://biblio.ugent.be/doc/api
    baseURL: https://biblio.ugent.be/sru
    tags: [ SRU, CQL, Research, Publications, Search, Library ]
    properties:
      - type: Documentation
