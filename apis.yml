      holdings, the institution code - but the contract is Ex Libris's and is not saved
      here. This entry also records a correction: the OAI-PMH, SRU, IIIF and OpenSearch
      interfaces the previous profile credited to lib.ugent.be were re-probed on
      2026-09-01 and return 404. They belonged to the library's earlier self-built
      catalogue and did not survive the move to Primo VE. Ghent University Library
      continues to publish its own Ex Libris Alma client and SDK as open source.
    humanURL: https://lib.ugent.be/catalog
