aid: ghent
name: Ghent University
x-type: university
x-category: Public Research University
description: >-
  Ghent University (Universiteit Gent, UGent) is a public research university in
  Ghent, Belgium, founded in 1817 and ranked around #169 in the QS World University
  Rankings. Like almost every institution, it is a federation of buyers rather than
  an API producer, and its profile is written on that basis: it operates no central
  developer portal, no gateway and no institution-wide API programme, and most of
  what looks like a Ghent API on first inspection belongs to a supplier. The real
  programmable footprint is concentrated in one place - Ghent University Library.
  The Academic Bibliography at biblio.ugent.be is genuinely the university's own: a
  documented JSON/JSONP REST search API, fourteen export formats, a live OAI-PMH 2.0
  endpoint identifying itself as the Ghent University Institutional Archive, an SRU
  1.1 service over CQL with 78 documented indexes, unAPI discovery, RSS feeds and
  daily full-dataset dumps, all under the Open Database License. The library also
  authors and open-sources the software behind it, and three of those services carry
  first-party OpenAPI 3.1 contracts. Beyond the library the university runs its own
  SAML 2.0 identity provider and eight entities in the Belgian Belnet R&E Federation,
  and hosts the student-built Hydra Resto API on a university domain. Everything else
  is somebody else's: the library catalogue is now an Ex Libris Alma/Primo VE tenancy,
  and Dodona, which began at Ghent, has moved to its own domain and its own pricing.
  There is no DataCite membership. Ghent is a Crossref member in its own name.
