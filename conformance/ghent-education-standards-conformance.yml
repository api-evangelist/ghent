  - standard: lti
    conformant: false
    evidence:
      - what: An LTI content-selection route exists on Dodona, but Dodona is not a Ghent University surface
        url: https://dodona.be/en/lti/content_selection
        status: 401
        detail: >-
          dodona.ugent.be 301-redirects to dodona.be. Dodona originated at Ghent University and
          UGent registered it as a service provider in the Belnet federation, but the platform is
          now operated on its own domain with its own pricing. Its LTI support is Dodona's, not
