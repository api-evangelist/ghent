regime: education
standards:
  - standard: oai-pmh
    conformant: true
    version: '2.0'
    evidence:
      - what: Live Identify response naming the repository and its policies
        url: https://biblio.ugent.be/oai?verb=Identify
        status: 200
        artifact: examples/ghent-biblio-oai-identify.xml
        detail: >-
          repositoryName "Ghent University Institutional Archive", baseURL
          https://biblio.ugent.be/oai, protocolVersion 2.0, repositoryIdentifier
          archive.ugent.be, deletedRecord persistent, granularity YYYY-MM-DDThh:mm:ssZ,
          adminEmail libservice@ugent.be.
      - what: ListMetadataFormats response
        url: https://biblio.ugent.be/oai?verb=ListMetadataFormats
        status: 200
        artifact: examples/ghent-biblio-oai-listmetadataformats.xml
      - what: OAI-PMH operations declared in the contract
        artifact: openapi/ghent-biblio-openapi.yml
        location: paths./oai.get
      - what: Ghent University Library publishes the OAI-PMH server it runs as open source
        url: https://github.com/ugent-library/oai-service
        artifact: openapi/ghent-oai-service-openapi.yaml
  - standard: saml
    conformant: true
    version: '2.0'
    evidence:
      - what: Ghent University's own SAML 2.0 Identity Provider metadata
        url: https://identity.ugent.be/simplesaml/saml2/idp/metadata.php
        status: 200
        content_type: application/samlmetadata+xml
        artifact: examples/ghent-saml-idp-metadata.xml
        detail: >-
          entityID https://identity.ugent.be/simplesaml/saml2/idp/metadata.php, signed with a
          certificate issued to O=Universiteit Gent, OU=Directie ICT, CN=identity.ugent.be.
          SimpleSAMLphp implementation, operated by the university's own ICT directorate.
      - what: Registered in the Belnet R&E Federation aggregate
        url: https://federation.belnet.be/federation-metadata.xml
        status: 200
        detail: >-
          Eight ugent.be entities appear in the Belgian national federation metadata - the IdP
          above plus seven service providers (apivsc.ugent.be, dodona.ugent.be,
          fairvault.dev.ugent.be, login.psb.ugent.be, naos.ugent.be, sso.irc.ugent.be and
          ugent.standaardstudentshop.be).
  - standard: shibboleth
    conformant: true
    evidence:
      - what: Shibboleth metadata extension namespace carried in the university's own IdP metadata
        artifact: examples/ghent-saml-idp-metadata.xml
        location: /md:EntityDescriptor/@xmlns:shibmd
        detail: >-
          The entity descriptor declares xmlns:shibmd="urn:mace:shibboleth:metadata:1.0", the
          Shibboleth metadata profile used across InCommon/eduGAIN-style federations. The IdP
          software itself is SimpleSAMLphp, not the Shibboleth IdP - the conformance is to the
          metadata profile, not to a software choice.
  - standard: orcid
    conformant: true
    evidence:
      - what: ORCID iD is a first-class field on the person record in the university's own contract
        artifact: openapi/ghent-people-service-openapi.yaml
        location: paths./set-person-orcid.post
      - what: ORCID iD is an accepted value of the author index in the bibliography query vocabulary
        artifact: vocabulary/ghent-biblio-cql-vocabulary.yml
        location: CQL search indexes -> author
        detail: 'author exact accepts "[last name], [first name]", biblio id, ugent id or orcid id'
      - what: A dedicated CQL index for ORCID
        artifact: vocabulary/ghent-biblio-cql-vocabulary.yml
        location: CQL search indexes -> orcid
      - what: Ghent University Library publishes its own ORCID 2.0 API client
        url: https://github.com/ugent-library/orcid
  - standard: crossref
    conformant: true
