  - term: the encloses relation is not supported
  - term: only the =/fuzzy relation modifier is supported
  - term: relation qualifiers are not supported
  - term: wildcards (* ?) are supported for the = relation but cannot be the first letter
  - term: anchors (^) are not yet supported
